name: Secret scan
on:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan checked out files with pinned Gitleaks
        run: docker run --rm -v "$PWD:/repo:ro" gitleaks/gitleaks:v8.24.3 detect --source /repo --no-git --redact --exit-code 1
