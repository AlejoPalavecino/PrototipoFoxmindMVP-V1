name: foxmind-local
services:
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: foxmind
      POSTGRES_USER: foxmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your terminal environment}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foxmind -d foxmind"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
