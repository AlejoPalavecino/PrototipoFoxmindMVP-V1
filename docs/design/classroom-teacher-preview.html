<style>
/* Teacher workflow refinements, using the existing FoxMind artwork and type. */
:root {
  --line: #e0e3ec;
  --muted: #62667c;
}
main { max-width: 1550px; width: 100%; margin: auto; }
button { transition: background-color 160ms, border-color 160ms, box-shadow 160ms, transform 160ms; }
button:active:not(:disabled) { transform: translateY(1px); }
.primary { box-shadow: 0 3px 0 #8b340f, 0 5px 14px #b8490c15; }
.primary:hover { background: #a63b08; box-shadow: 0 3px 0 #7f2b09, 0 7px 18px #b8490c25; }
.primary:disabled { box-shadow: none; }
.catalog-head { padding-block: 12px 10px; }
.catalog-head h1 { margin-bottom: 9px; }
.pills { background: #e9eaf2; padding: 5px; box-shadow: inset 0 2px 4px #25264608; }
.pills button { border-radius: 11px; }
.pills button[aria-pressed=true] { box-shadow: 0 3px 8px #25264612; }
.pills button[aria-pressed=true] .count { background: #b8490c; color: white; }
.filters { padding-block: 6px 4px; margin-bottom: 20px; }
.filters input, .filters select { border-color: #b4bbcd; }
.cards { gap: 22px; }
.card { box-shadow: 0 6px 20px #25264606; transition: border-color 180ms, box-shadow 180ms; }
.card:hover { border-color: #d8b899; box-shadow: 0 12px 28px #543c2010; }
.card-body { padding: 21px; }
.card-body h3 { font-size: 22px; margin: 10px 0 8px; }
.card .cover { height: 155px; }
.card-actions { padding-top: 8px; }
.card-actions > .primary { width: 100%; }
.room-hero { min-height: 145px; padding: 21px 28px; }
.room-hero h1 { font-size: clamp(28px,3.2vw,40px); }
.tabs { margin-bottom: 22px; }
.teaching-actions {
  display: flex; align-items: center; justify-content: space-between;
  gap: 18px; padding: 18px 20px; border: 1px solid #ead7c4;
  border-radius: 18px; background: #fff9f1; margin-bottom: 26px;
}
.teaching-actions strong { font-size: 16px; }
.teaching-actions p { margin-top: 3px; font-size: 12px; }
.teaching-actions button { background: #fff; border-color: #dec9b4; font-size: 13px; }
.section-head { margin-bottom: 22px; }
.section-head h2 { font-size: 27px; }
.section-head p { margin-top: 9px; }
.room-body > .plan > article { padding: 25px; }
.plan > .stack { gap: 14px; }
.unit summary { background: #f3effa; padding: 16px; }
.plan .topic { margin-block: 2px; padding: 12px; }
.plan .topic[aria-pressed=true] { border: 1px solid #efd2b6; font-weight: 600; }
.plan .empty { border: 0; padding: 15px; background: #f7f8fb; font-size: 13px; }
.plan article > .row:first-child h3 { font-size: 24px; margin-bottom: 6px; }
.plan [data-action=given] { background: #fff5e9; color: #8d3307; border-color: #deb78e; }
.plan [data-action=given]:hover { background: #ffe9cf; }
input, textarea, select { transition: border-color 160ms, box-shadow 160ms; border-color: #abb3c7; }
input:focus, textarea:focus, select:focus { border-color: #b4693c; }
label { gap: 8px; font-size: 13px; }
textarea { line-height: 1.7; }
.stack { gap: 19px; }
.two { gap: 18px; }
dialog { border-radius: 25px; box-shadow: 0 28px 90px #25264638; }
.dialog-head { padding: 22px 26px 18px; }
.dialog-head h2 { font-size: 22px; }
.dialog-body { background: #fcfcfe; padding: 25px 28px; }
.dialog-foot { padding: 17px 26px; box-shadow: 0 -5px 20px #25264604; }
.step-intro h3 { font-size: 25px; }
.step-intro p { margin-top: 7px; }
.steps { list-style: none; padding: 0; margin: 18px 0 0; gap: 10px; }
.steps li { display: flex; align-items: center; gap: 8px; color: #6c7084; min-width: 0; font-size: 12px; }
.steps li > b {
  display: grid; place-items: center; flex: 0 0 28px; height: 28px;
  border: 1px solid #d8ddeb; border-radius: 50%; background: #fff;
}
.steps li span { border: 0; padding: 0; font-size: inherit; }
.steps li[aria-current=step] { border: 0; background: #fff0e1; color: #8e350c; padding: 9px; border-radius: 12px; font-weight: 600; }
.steps li[aria-current=step] > b { background: #b8490c; color: white; border-color: #b8490c; }
.steps li.done > b { background: #e4f1e9; color: #2a644b; border-color: #b9d6c5; }
.method-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.method-options label {
  display: flex; align-items: center; gap: 11px; border: 1px solid #ccd3e2;
  border-radius: 15px; padding: 18px 14px; background: white; cursor: pointer;
  transition: border-color 160ms, background-color 160ms;
}
.method-options label:has(input:checked) { background: #fff4e8; border-color: #b4693c; box-shadow: 0 3px 0 #eed8c2; }
.method-options input { accent-color: #b8490c; }
.method-options strong, .method-options small { display: block; }
.method-options strong { margin-bottom: 4px; font-size: 14px; }
.method-options small { line-height: 1.5; font-weight: 400; }
.method-icon { display: grid; place-items: center; width: 35px; height: 35px; border-radius: 12px; background: #f1edf9; flex-shrink: 0; }
.method-icon img { margin: 0; width: 19px; height: 19px; }
.drop { background: #f4f2fc; border-color: #b8afd1; padding: 24px; gap: 9px; }
.upload-symbol { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 17px; background: white; box-shadow: 0 3px 10px #25264607; }
.upload-symbol .icon { margin: 0; }
.drop.has-file { background: #f0f7f3; border-color: #a2c3b1; }
.drop strong { overflow-wrap: anywhere; max-width: 100%; }
.file-picker { position: relative; display: inline-block; border: 1px solid #d2b093; background: #fff; padding: 10px 18px; border-radius: 12px; color: #8f3c12; cursor: pointer; }
.file-picker input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.file-picker:focus-within { outline: 3px solid #9a3e00; outline-offset: 3px; }
.attachment:empty { display: none; }
.cover-options { flex-wrap: nowrap; overflow-x: auto; padding: 2px 2px 8px; }
.cover-options button { min-width: 110px; }
.optional-section { border: 1px solid var(--line); border-radius: 15px; background: white; padding: 16px 18px; }
.optional-section summary { cursor: pointer; font-weight: 600; line-height: 1.6; }
.optional-section summary small { font-weight: 400; margin-left: 8px; }
.optional-section[open] > .stack { margin-top: 20px; }
.editor { max-width: 930px; }
.editor .panel { padding: 25px; }
.editor-actions { padding: 15px; border: 1px solid var(--line); background: #fff; border-radius: 16px; box-shadow: 0 5px 22px #25264608; }
.success-feedback {
  position: fixed; z-index: 4; bottom: 22px; left: calc(50% + 109px); transform: translateX(-50%);
  width: max-content; max-width: min(620px,calc(100vw - 250px)); display: flex; align-items: center;
  gap: 12px; background: #fff; padding: 11px 14px; border: 1px solid #bdd6c9;
  border-radius: 17px; box-shadow: 0 10px 35px #253a2920; color: #28523c;
}
.success-symbol { display: grid; place-items: center; width: 30px; height: 30px; flex-shrink: 0; border-radius: 50%; background: #e2f1e8; }
.success-feedback .link { min-width: 44px; }
.loading-state { position: relative; display: flex; align-items: center; flex-wrap: wrap; gap: 15px; padding: 22px; background: #f3eefb; border: 1px solid #ded4ee; border-radius: 18px; margin-bottom: 18px; }
.loading-state > div { flex: 1; min-width: 0; }
.loading-state strong { display: block; font-size: 16px; }
.loading-state p { font-size: 13px; margin-top: 5px; }
.loading-orbit { display: grid; place-items: center; flex: 0 0 42px; height: 42px; border-radius: 50%; border: 3px solid #d9cce9; border-top-color: #8d5fba; }
.loading-orbit .icon { margin: 0; }
.loading-track { flex-basis: 100%!important; height: 4px; background: #e5ddf1; border-radius: 8px; overflow: hidden; }
.loading-track i { display: block; width: 30%; height: 100%; background: #a387bf; border-radius: inherit; }
.skeleton-preview { padding: 20px; border: 1px solid var(--line); border-radius: 15px; background: #fff; margin-bottom: 18px; }
.skeleton-preview i { display: block; height: 12px; background: linear-gradient(90deg,#ecebf3,#faf9fd,#ecebf3); background-size: 200% 100%; border-radius: 7px; margin-bottom: 14px; }
.skeleton-preview i:first-child { width: 42%; height: 18px; }
.skeleton-preview i:last-child { width: 76%; }
@media(prefers-reduced-motion:no-preference) {
  .room-body, #results { animation: content-enter 180ms ease-out; }
  .dialog-body { animation: content-enter 200ms ease-out; }
  dialog[open] { animation: dialog-enter 200ms ease-out; }
  .success-feedback { animation: feedback-enter 220ms ease-out; }
  .success-symbol { animation: check-in 280ms ease-out; }
  .loading-orbit { animation: orbit 1400ms linear infinite; }
  .loading-orbit .icon { animation: orbit 1400ms linear infinite reverse; }
  .loading-track i { animation: loading-slide 1400ms ease-in-out infinite; }
  .skeleton-preview i { animation: skeleton-shimmer 1600ms ease-in-out infinite; }
}
@keyframes content-enter { from { transform: translateY(5px); } to { transform: translateY(0); } }
@keyframes dialog-enter { from { transform: translateY(8px) scale(.99); } to { transform: none; } }
@keyframes feedback-enter { from { opacity: 0; margin-bottom: -6px; } to { opacity: 1; margin-bottom: 0; } }
@keyframes orbit { to { transform: rotate(360deg); } }
@keyframes loading-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(440%); } }
@keyframes skeleton-shimmer { to { background-position: -200% 0; } }
@media(max-width:1050px) { .teaching-actions { flex-direction: column; align-items: flex-start; } }
@media(max-width:760px) {
  .teaching-actions { padding: 15px; gap: 12px; }
  .teaching-actions .row { gap: 6px; }
  .teaching-actions button { padding-inline: 9px; }
  .method-options { grid-template-columns: 1fr; }
  .steps { display: none; }
  .success-feedback { left: 50%; max-width: calc(100vw - 24px); bottom: 12px; }
  .dialog-head, .dialog-foot { padding: 15px; }
